services:
  - type: web
    name: dhr-deep-house-radio
    env: node
    plan: starter
    buildCommand: npm run build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: PATREON_CLIENT_ID
        sync: false
      - key: PATREON_CLIENT_SECRET
        sync: false
      - key: VITE_PATREON_CLIENT_ID
        sync: false
      - key: VITE_PATREON_CLIENT_SECRET
        sync: false
      - key: VITE_PATREON_REDIRECT_URI
        sync: false
      - key: SESSION_SECRET
        sync: false
